name: Loadout ZIP-only Android build

on:
  push:
    branches: [main]
    paths:
      - 'loadout-source.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loadout-zip-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Extract, verify and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Verify and extract complete source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f loadout-source.zip || { echo 'loadout-source.zip is missing from the repository root.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/loadout-source"
          unzip -tq loadout-source.zip
          unzip -q loadout-source.zip -d "$RUNNER_TEMP/loadout-source"
          test -f "$RUNNER_TEMP/loadout-source/package.json"
          test -f "$RUNNER_TEMP/loadout-source/native/android/LoadoutCorePlugin.java"
          rsync -a "$RUNNER_TEMP/loadout-source/" "$GITHUB_WORKSPACE/"
          echo 'Complete source extracted. Native plugin is present.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore owner debug signing key (optional)
        env:
          LOADOUT_DEBUG_KEYSTORE_BASE64: ${{ secrets.LOADOUT_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${LOADOUT_DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$LOADOUT_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using owner-supplied persistent debug keystore."
          else
            keytool -genkeypair -v -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No persistent keystore secret supplied; debug signing may differ between runs."
          fi

      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize signed-catalog source hashes
        run: npm run registry:sync

      - name: Refresh source inventory
        run: npm run inventory

      - name: Unit tests
        run: npm test

      - name: Historical dataset integrity audit
        run: npm run audit:data

      - name: JavaScript and repository checks
        run: npm run check

      - name: Build Android APK
        run: node scripts/build.mjs

      - name: Upload APK and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: Loadout-Android-1.8.0-debug
          path: |
            dist/Loadout-Android-debug.apk
            dist/Loadout-Android-debug.apk.sha256
            build/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 30

